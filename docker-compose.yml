services:
  postgres:
    image: postgres:16-alpine
    container_name: mandate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: mandate
      POSTGRES_DB: mandate
    ports:
      - "5432:5432"
    volumes:
      - mandate-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: mandate-gateway
    restart: unless-stopped
    env_file:
      - ./apps/gateway/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://mandate:mandate@postgres:5432/mandate
      MERCHANT_APP_ORIGIN: http://localhost:3000
      MERCHANT_INTERNAL_URL: http://merchant:3000
      BUYER_APP_ORIGIN: http://localhost:3001
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-mandate-local-gateway}
      RAZORPAY_BASE_URL: https://api.razorpay.com/v1
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      merchant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: mandate-mcp
    restart: unless-stopped
    command: ["npm", "run", "start:mcp", "-w", "@mandate/gateway"]
    environment:
      NODE_ENV: production
      MCP_PORT: 4100
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-mandate-local-mcp}
      MCP_GATEWAY_INTERNAL_URL: http://gateway:4000
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-mandate-local-gateway}
      DATABASE_URL: postgresql://mandate:mandate@postgres:5432/mandate
    ports:
      - "4100:4100"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4100/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-service:
    build:
      context: .
      dockerfile: apps/service/Dockerfile
    container_name: mandate-agent-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      X402_PORT: 4021
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      X402_PAY_TO: ${X402_PAY_TO:-}
      X402_SERVICE_ID: ${X402_SERVICE_ID:-mandate-premium-data}
      X402_SERVICE_NAME: ${X402_SERVICE_NAME:-MANDATE Agent Service}
      X402_PRICE_ATOMIC: ${X402_PRICE_ATOMIC:-10000}
      X402_NETWORK: ${X402_NETWORK:-eip155:84532}
      X402_ASSET: ${X402_ASSET:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}
      X402_MAX_TIMEOUT_SECONDS: ${X402_MAX_TIMEOUT_SECONDS:-60}
      X402_DEMO_MODE: ${X402_DEMO_MODE:-true}
    ports:
      - "4021:4021"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4021/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  merchant:
    build:
      context: .
      dockerfile: apps/merchant/Dockerfile
    container_name: mandate-merchant
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GATEWAY_INTERNAL_URL: http://gateway:4000
      MCP_INTERNAL_URL: http://mcp:4100
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-mandate-local-mcp}
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-mandate-local-gateway}
      ACP_API_KEY: ${ACP_API_KEY:-mandate-local-acp}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  buyer:
    build:
      context: .
      dockerfile: apps/buyer/Dockerfile
    container_name: mandate-buyer
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
      NEXT_PUBLIC_MERCHANT_URL: http://localhost:3000
      GATEWAY_INTERNAL_URL: http://gateway:4000
      MERCHANT_INTERNAL_URL: http://merchant:3000
      MCP_INTERNAL_URL: http://mcp:4100
      MCP_AGENT_TOKEN: ${MCP_AGENT_TOKEN:-mandate-local-mcp}
      X402_SERVICE_INTERNAL_URL: http://agent-service:4021
    ports:
      - "3001:3001"
    depends_on:
      gateway:
        condition: service_healthy
      merchant:
        condition: service_started
      mcp:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mandate-postgres-data:
