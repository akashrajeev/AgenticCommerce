services:
  postgres:
    image: postgres:16-alpine
    container_name: mandate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: mandate
      POSTGRES_DB: mandate
    ports:
      - "5432:5432"
    volumes:
      - mandate-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: mandate-gateway
    restart: unless-stopped
    environment:
      PORT: 4000
      MERCHANT_APP_ORIGIN: http://localhost:3000
      MERCHANT_INTERNAL_URL: http://merchant:3000
      BUYER_APP_ORIGIN: http://localhost:3001
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-mandate-local-gateway}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_BASE_URL: https://api.razorpay.com/v1
    ports:
      - "4000:4000"
    depends_on:
      merchant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  merchant:
    build:
      context: .
      dockerfile: apps/merchant/Dockerfile
    container_name: mandate-merchant
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GATEWAY_INTERNAL_URL: http://gateway:4000
      INTERNAL_GATEWAY_SECRET: ${INTERNAL_GATEWAY_SECRET:-mandate-local-gateway}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  buyer:
    build:
      context: .
      dockerfile: apps/buyer/Dockerfile
    container_name: mandate-buyer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000
      NEXT_PUBLIC_MERCHANT_URL: http://localhost:3000
      MERCHANT_INTERNAL_URL: http://merchant:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "3001:3001"
    depends_on:
      gateway:
        condition: service_healthy
      merchant:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mandate-postgres-data:
