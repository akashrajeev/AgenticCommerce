name: one-shot-mcp-razorpay-proxy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.repository == 'akashrajeev/AgenticCommerce' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply gateway-only Razorpay boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/mcp-razorpay-proxy.pending
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/gateway/src/app.ts')
          text = app.read_text()
          marker = 'app.get("/v1/transactions", (_request, response) => response.json({ transactions: getAllTransactions() }));'
          if marker not in text:
              raise SystemExit('gateway route insertion marker not found')
          routes = '''app.get("/v1/internal/razorpay/status", (request, response) => {
  const providedSecret = request.header("x-mandate-gateway-secret") ?? "";
  if (!providedSecret || providedSecret !== config.internalGatewaySecret) return response.status(401).json({ error: "UNAUTHORIZED_INTERNAL_RAZORPAY" });
  const deep = request.query.deep === "1";
  if (!deep) return response.json({ testMode: config.razorpayKeyId.startsWith("rzp_test_"), configured: Boolean(config.razorpayKeyId && config.razorpayKeySecret) });
  void import("./razorpay.js").then(async ({ probeTestModeCredentials, isRazorpayTestMode }) => response.json({ testMode: isRazorpayTestMode(), configured: true, probe: await probeTestModeCredentials() })).catch((error: unknown) => response.status(503).json({ testMode: config.razorpayKeyId.startsWith("rzp_test_"), configured: Boolean(config.razorpayKeyId && config.razorpayKeySecret), error: error instanceof Error ? error.message : "RAZORPAY_PROBE_FAILED" }));
});
app.get("/v1/internal/razorpay/orders/:orderId", async (request, response) => {
  const providedSecret = request.header("x-mandate-gateway-secret") ?? "";
  if (!providedSecret || providedSecret !== config.internalGatewaySecret) return response.status(401).json({ error: "UNAUTHORIZED_INTERNAL_RAZORPAY" });
  try { const { fetchOrder } = await import("./razorpay.js"); return response.json({ order: await fetchOrder(request.params.orderId) }); }
  catch (error) { return response.status(502).json({ error: error instanceof Error ? error.message : "RAZORPAY_ORDER_FETCH_FAILED" }); }
});
app.get("/v1/internal/razorpay/payments/:paymentId", async (request, response) => {
  const providedSecret = request.header("x-mandate-gateway-secret") ?? "";
  if (!providedSecret || providedSecret !== config.internalGatewaySecret) return response.status(401).json({ error: "UNAUTHORIZED_INTERNAL_RAZORPAY" });
  try { const { fetchPayment } = await import("./razorpay.js"); return response.json({ payment: await fetchPayment(request.params.paymentId) }); }
  catch (error) { return response.status(502).json({ error: error instanceof Error ? error.message : "RAZORPAY_PAYMENT_FETCH_FAILED" }); }
});
'''
          text = text.replace(marker, routes + marker, 1)
          app.write_text(text)

          mcp = Path('apps/gateway/src/mcp-server.ts')
          text = mcp.read_text()
          old_import = 'import { fetchOrder, fetchPayment, isRazorpayTestMode, probeTestModeCredentials } from "./razorpay.js";'
          if old_import not in text:
              raise SystemExit('MCP Razorpay import marker not found')
          text = text.replace(old_import, 'import { isRazorpayTestMode } from "./razorpay.js";', 1)
          # Keep the MCP process free of direct Razorpay API calls; status/evidence are fetched via gatewayJson.
          old_verify = 'const [order, payment] = await Promise.all([fetchOrder(orderId), fetchPayment(paymentId)]);'
          new_verify = 'const [orderResponse, paymentResponse] = await Promise.all([gatewayJson(`/v1/internal/razorpay/orders/${encodeURIComponent(orderId)}`), gatewayJson(`/v1/internal/razorpay/payments/${encodeURIComponent(paymentId)}`)]); const order = (orderResponse as Record<string, unknown>).order as Record<string, unknown>; const payment = (paymentResponse as Record<string, unknown>).payment as Record<string, unknown>;'
          if old_verify not in text:
              raise SystemExit('MCP settlement fetch marker not found')
          text = text.replace(old_verify, new_verify, 1)
          old_probe = 'const probe = await probeTestModeCredentials();\n    return response.json({ ...base, razorpayApiReachable: probe.reachable, razorpayProbe: { ...probe, latencyMs: Date.now() - started } });'
          new_probe = 'const probeResponse = await gatewayJson("/v1/internal/razorpay/status?deep=1", { method: "GET" }); const probe = (probeResponse as Record<string, unknown>).probe as Record<string, unknown> | undefined; return response.json({ ...base, razorpayTestMode: (probeResponse as Record<string, unknown>).testMode === true, razorpayApiReachable: probe?.reachable === true, razorpayProbe: { ...(probe ?? {}), latencyMs: Date.now() - started } });'
          if old_probe not in text:
              raise SystemExit('MCP deep probe marker not found')
          text = text.replace(old_probe, new_probe, 1)
          mcp.write_text(text)

          status = Path('PROTOCOL_STATUS.md')
          if status.exists():
              body = status.read_text()
              body = body.replace('mandate_razorpay_verify_settlement\n```', 'mandate_razorpay_verify_settlement\nmandate_razorpay_explain_transaction\n```')
              body = body.replace('The MCP service sends trusted internal requests to the gateway; it does not hold or expose Razorpay API secrets to the agent.', 'All Razorpay reads and writes are performed by the gateway. The MCP service sends authenticated internal requests to the gateway and does not import the Razorpay API client or hold Razorpay API secrets.')
              status.write_text(body)

          Path('.github/mcp-razorpay-proxy.pending').unlink()
          Path('.github/workflows/one-shot-mcp-razorpay-proxy.yml').unlink()
          PY
      - name: Commit and push patched tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/src/app.ts apps/gateway/src/mcp-server.ts PROTOCOL_STATUS.md .github/mcp-razorpay-proxy.pending .github/workflows/one-shot-mcp-razorpay-proxy.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep Razorpay credentials behind gateway"
          git push origin HEAD:main
