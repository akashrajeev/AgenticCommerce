name: Refresh latest workspace lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reset to latest main
        run: git fetch origin main && git checkout main && git reset --hard origin/main
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/refresh-lock.yml
          git commit -m "chore: refresh workspace lockfile [lock-refresh]"
          git push origin main
