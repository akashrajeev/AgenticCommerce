name: One-shot Prisma Runtime Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch only when requested
        run: |
          if [ ! -f .prisma-runtime-patch.pending ]; then
            echo "No pending Prisma runtime patch."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import json

          transaction_core = Path("apps/gateway/src/transaction-core.ts")
          source = transaction_core.read_text()
          source = source.replace(
              'import { saveAuditEvent, saveTransaction } from "./persistence.js";',
              'import { saveAuditEvent, saveTransaction } from "./persistence-prisma.js";',
              1,
          )
          transaction_core.write_text(source)

          app = Path("apps/gateway/src/app.ts")
          source = app.read_text()
          source = source.replace(
              'import { claimWebhookEvent, getRealizedRevenueAttribution, initializePersistence, isDatabaseConfigured, listMerchantOrders, releaseWebhookEvent, saveMerchantOrder } from "./persistence.js";',
              'import { getRealizedRevenueAttribution, initializePersistence, isDatabaseConfigured, listMerchantOrders, saveMerchantOrder } from "./persistence.js";\nimport { claimWebhookEvent, releaseWebhookEvent } from "./persistence-prisma.js";',
              1,
          )
          app.write_text(source)

          package_path = Path("apps/gateway/package.json")
          package_data = json.loads(package_path.read_text())
          package_data["scripts"]["postinstall"] = "prisma generate --config ../../prisma.config.ts"
          package_path.write_text(json.dumps(package_data, indent=2) + "\n")
          PY

          rm .prisma-runtime-patch.pending
          rm .github/workflows/prisma-runtime-patch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/src/transaction-core.ts apps/gateway/src/app.ts apps/gateway/package.json .prisma-runtime-patch.pending .github/workflows/prisma-runtime-patch.yml
          git commit -m "feat: route gateway persistence through Prisma"
          git push origin HEAD:main
