name: MANDATE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Initialize PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/init.sql
        env:
          DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate

      - name: Prisma persistence smoke test
        run: npm run prisma:smoke -w @mandate/gateway
        env:
          DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate

      - name: Merchant growth experiment persistence smoke test
        run: npm run test:integration -w @mandate/merchant
        env:
          DATABASE_URL: postgresql://mandate:mandate@localhost:5432/mandate

      - name: Build
        run: npm run build
