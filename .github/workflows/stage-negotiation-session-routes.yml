name: One-shot negotiation session routes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply durable session routes
        if: ${{ hashFiles('.stage-negotiation-session-routes') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/gateway/src/server.ts')
          s = p.read_text()
          old_import = 'import { initializePersistence } from "./persistence.js";'
          new_import = 'import { initializePersistence } from "./persistence.js";\nimport { loadNegotiationSession, saveNegotiationSession } from "./persistence-prisma.js";'
          if old_import not in s:
              raise SystemExit('persistence import not found')
          s = s.replace(old_import, new_import, 1)
          marker = 'const app = createApp();\n'
          routes = '''const app = createApp();\n\napp.post("/v1/negotiation-sessions", async (request, response) => {\n  try {\n    internalSecretOrThrow(request, "UNAUTHORIZED_NEGOTIATION_SESSION");\n    const body = request.body as Record<string, unknown> | null;\n    if (!body || typeof body.negotiationId !== "string" || !body.negotiationId.trim() || !Array.isArray(body.offers) || !Array.isArray(body.turns) || !body.intent || !body.merchant || typeof body.createdAt !== "string" || typeof body.expiresAt !== "string") return response.status(400).json({ error: "INVALID_NEGOTIATION_SESSION" });\n    const session = {\n      negotiationId: body.negotiationId.trim(),\n      intent: body.intent as Record<string, unknown>,\n      merchant: body.merchant as { agentId: "merchant-agent:mandate-market"; agentType: "merchant"; name: string; issuer: string },\n      offers: body.offers as import("@mandate/types").MerchantOffer[],\n      offerAttestations: Array.isArray(body.offerAttestations) ? body.offerAttestations as import("@mandate/types").MerchantOfferAttestation[] : undefined,\n      turns: body.turns as Array<Record<string, unknown>>,\n      createdAt: body.createdAt,\n      expiresAt: body.expiresAt,\n    };\n    await saveNegotiationSession(session);\n    return response.status(201).json({ saved: true, negotiationId: session.negotiationId });\n  } catch (error) {\n    const message = error instanceof Error ? error.message : "NEGOTIATION_SESSION_SAVE_FAILED";\n    return response.status(message.startsWith("UNAUTHORIZED") ? 401 : 422).json({ error: message });\n  }\n});\n\napp.get("/v1/negotiation-sessions/:negotiationId", async (request, response) => {\n  try {\n    internalSecretOrThrow(request, "UNAUTHORIZED_NEGOTIATION_SESSION");\n    const session = await loadNegotiationSession(request.params.negotiationId);\n    if (!session) return response.status(404).json({ error: "NEGOTIATION_SESSION_NOT_FOUND" });\n    return response.json({ session });\n  } catch (error) {\n    const message = error instanceof Error ? error.message : "NEGOTIATION_SESSION_LOAD_FAILED";\n    return response.status(message === "NEGOTIATION_SESSION_NOT_FOUND" ? 404 : 401).json({ error: message });\n  }\n});\n'''
          if marker not in s:
              raise SystemExit('app marker not found')
          p.write_text(s.replace(marker, routes, 1))
          Path('.stage-negotiation-session-routes').unlink(missing_ok=True)
          Path('.github/workflows/stage-negotiation-session-routes.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/src/server.ts .stage-negotiation-session-routes .github/workflows/stage-negotiation-session-routes.yml
          git commit -m "feat: expose durable negotiation session endpoints"
          git push origin HEAD:main
