name: One-shot negotiation hydration patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply negotiation startup hydration
        if: ${{ hashFiles('.stage-negotiation-hydration') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/gateway/src/server.ts')
          s = p.read_text()
          old = 'import { acceptNegotiatedOffer } from "./negotiation.js";'
          new = 'import { acceptNegotiatedOffer, hydrateNegotiationAcceptancesFromPersistence } from "./negotiation.js";'
          if old not in s:
              raise SystemExit('negotiation import not found')
          s = s.replace(old, new, 1)
          old_chain = '''initializePersistence()\n  .then((seed) => {\n    hydrateTransactionStore(seed);\n    return hydrateDelegatedMandatesFromPersistence();\n  })\n  .then(() => app.listen(config.port, () => console.log(`MANDATE gateway listening on http://localhost:${config.port}`)))'''
          new_chain = '''initializePersistence()\n  .then((seed) => {\n    hydrateTransactionStore(seed);\n    return hydrateDelegatedMandatesFromPersistence();\n  })\n  .then(() => hydrateNegotiationAcceptancesFromPersistence())\n  .then(() => app.listen(config.port, () => console.log(`MANDATE gateway listening on http://localhost:${config.port}`)))'''
          if old_chain not in s:
              raise SystemExit('startup chain not found')
          p.write_text(s.replace(old_chain, new_chain, 1))
          Path('.stage-negotiation-hydration').unlink(missing_ok=True)
          Path('.github/workflows/stage-negotiation-hydration.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/gateway/src/server.ts .stage-negotiation-hydration .github/workflows/stage-negotiation-hydration.yml
          git commit -m "feat: restore negotiated acceptance state on startup"
          git push origin HEAD:main
